name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.1.0). Leave blank to use package.json version.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build Android Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Setup Android SDK & Native Toolchain
        id: setup_android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-35 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔧 Make Gradle Executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Standalone Release APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_android.outputs.ndk-path }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📋 Prepare Release Artifacts & Checksum
        id: prepare_release
        run: |
          # Determine version/tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG="v${PKG_VERSION}"
          fi

          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found at $APK_SRC"
            exit 1
          fi

          RELEASE_NAME="YouTube_wr-${TAG}.apk"
          cp "$APK_SRC" "$RELEASE_NAME"

          SHA256=$(sha256sum "$RELEASE_NAME" | awk '{print $1}')
          FILE_SIZE=$(du -h "$RELEASE_NAME" | awk '{print $1}')

          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_file=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          name: YouTube_wr ${{ steps.prepare_release.outputs.tag_name }}
          files: ${{ steps.prepare_release.outputs.release_file }}
          generate_release_notes: true
          body: |
            ### 🚀 YouTube_wr Standalone Release (${{ steps.prepare_release.outputs.tag_name }})

            Standalone offline release APK for Android. Built and verified automatically via GitHub Actions.

            #### 📦 Binary Information
            - **File:** `${{ steps.prepare_release.outputs.release_file }}`
            - **Size:** `${{ steps.prepare_release.outputs.file_size }}`
            - **SHA-256 Checksum:** `${{ steps.prepare_release.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
